# Compose 部署用配置：复制为仓库根的 asu.yaml 并按需修改。
# 完整字段说明见 configs/asu.example.yaml。
server:
  listen: ":8000"
  # 无前缀的公开 API 默认发行版；ImmortalWrt 客户端请使用 /immortalwrt。
  default_distro: openwrt
  cors:
    # 公开 API 与产物默认允许任意来源（无凭据）；精确列表限制来源，[] 关闭。
    public_origins: ["*"]
    # 管理 API 默认仅同源；跨域时填精确来源（携带凭据），禁止 *，不影响静态页面。
    admin_origins: []
log:
  format: json
  level: info
  # 可设为 /data/asu.log；默认仅 stdout，由容器日志驱动收集。
  file: ""
data_dir: /data
admin:
  # 也可用环境变量 ASU_ADMIN_TOKEN 提供（CLI 与自动化使用）。
  api_token: ""
  # 随机长密钥；留空则每次启动随机生成，重启后登录会话失效。
  session_secret: ""
  # 用 `docker compose run --rm asu admin hash-password` 生成 bcrypt 哈希。
  # users:
  #   - name: admin
  #     password_hash: '$2a$...'
runtime:
  driver: docker
  # 容器内路径；由 compose.yaml 把宿主引擎 socket 挂到这里。Podman 同样使用 docker 驱动。
  socket: unix:///var/run/docker.sock
runner:
  verbose: true
  cache:
    enabled: true
    # 默认 {data_dir}/cache。
    dir: ""
    max_size_gb: 20
queue:
  max_concurrent_builds: 2

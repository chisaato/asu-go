# 优先级：命令行 flag > ASU_* 环境变量 > YAML > 默认值。
# 环境变量：ASU_SERVER_LISTEN、ASU_LOG_LEVEL、ASU_DATA_DIR、ASU_ADMIN_TOKEN。
server:
  listen: ":8000"
log:
  format: json
  level: info
data_dir: data
admin:
  # 为空仅禁用 Bearer 路径；没有有效 cookie 或 token 时返回 401。
  api_token: ""
  # 使用 asu admin hash-password 从 stdin 生成 bcrypt 哈希。
  # users:
  #   - name: admin
  #     password_hash: '$2a$...'
  users: null
  # 为空则启动生成随机密钥并警告，重启后已有会话失效。生产环境应配置随机长密钥。
  session_secret: ""
  session_ttl: 24h
queue:
  driver: sqlite
  max_concurrent_builds: 2
  job_timeout: 10m
store:
  driver: local
stats:
  driver: sqlite
runtime:
  driver: docker
  socket: unix:///var/run/docker.sock
  # 内存单位为字节；0 表示不限。
  memory_limit: 0
  cpus: 0
  pull_policy: missing
  # rolling 镜像到期强制复查；每次进程重启后首次使用也会复查。
  rolling_recheck: 6h
  scavenger_interval: 5m
metadata:
  refresh_interval: 1h
diagnostics:
  # 168h 即 7 天，时长使用 Go time.Duration 格式。
  retention: 168h
  keep_container_ttl: 1h
  max_kept: 3

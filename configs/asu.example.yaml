# 优先级：命令行 flag > ASU_* 环境变量 > YAML > 默认值。
# 环境变量：ASU_SERVER_LISTEN、ASU_LOG_LEVEL、ASU_DATA_DIR。
server:
  listen: ":8000"
log:
  format: json
  level: info
data_dir: data
admin:
  # 后续管理 API 使用；当前空壳服务不提供管理接口。
  api_token: ""
queue:
  driver: sqlite
  max_concurrent_builds: 2
  job_timeout: 10m
store:
  driver: local
runtime:
  driver: docker
  socket: unix:///var/run/docker.sock
  # 内存单位为字节；0 表示不限。
  memory_limit: 0
  cpus: 0
  pull_policy: missing
metadata:
  refresh_interval: 1h
diagnostics:
  # 168h 即 7 天，时长使用 Go time.Duration 格式。
  retention: 168h
  keep_container_ttl: 1h
  max_kept: 3

# 优先级：命令行 flag > ASU_* 环境变量 > YAML > 默认值。
# 环境变量：ASU_SERVER_LISTEN、ASU_LOG_LEVEL、ASU_DATA_DIR、ASU_ADMIN_TOKEN。
server:
  listen: ":8000"
  # 无路径前缀时使用的发行版，必须在 sources 中启用；/immortalwrt/ 等前缀独立选择发行版。
  default_distro: openwrt
  cors:
    # 公开 /api/、/json/、/store/：* 不携带凭据；可改为精确来源列表，[] 关闭。
    public_origins: ["*"]
    # 管理 /admin/api/：默认仅同源；精确来源启用凭据，禁止 *，不影响 /admin 静态页面。
    admin_origins: []
log:
  format: json
  level: info
  # 同时写 stdout 与文件；空字符串关闭文件输出。启动时超过 50MiB 轮转至 .1。
  file: ""
data_dir: data
admin:
  # 为空仅禁用 Bearer 路径；没有有效 cookie 或 token 时返回 401。
  api_token: ""
  # 使用 asu admin hash-password 从 stdin 生成 bcrypt 哈希。
  # users:
  #   - name: admin
  #     password_hash: '$2a$...'
  users: null
  # 为空则启动生成随机密钥并警告，重启后已有会话失效。生产环境应配置随机长密钥。
  session_secret: ""
  session_ttl: 24h
queue:
  driver: sqlite
  max_concurrent_builds: 2
  max_pending_jobs: 200
  job_timeout: 10m
  build_ttl: 168h
  build_unversioned_ttl: 24h
  build_defaults_ttl: 30m
  build_failure_ttl: 1h
build:
  allow_defaults: false
  max_defaults_length: 20480
  max_custom_rootfs_size_mb: 1024
  repository_allow_list: null
store:
  driver: local
  # 留空时跟随 data_dir，使用 {data_dir}/store。
  dir: ""
cleaner:
  interval: 10m
  # 仅删除无 jobs 记录的公开 hash 目录；内部临时目录保留。
  orphan_grace: 1h
stats:
  driver: sqlite
runtime:
  driver: docker
  socket: unix:///var/run/docker.sock
  # 内存单位为字节；0 表示不限。
  memory_limit: 0
  cpus: 0
  pull_policy: missing
  # rolling 镜像到期强制复查；每次进程重启后首次使用也会复查。
  rolling_recheck: 6h
  scavenger_interval: 5m
metadata:
  refresh_interval: 1h
  cache_ttl: 1h
diagnostics:
  # 168h 即 7 天，时长使用 Go time.Duration 格式。
  retention: 168h
  keep_container_ttl: 1h
  max_kept: 3
